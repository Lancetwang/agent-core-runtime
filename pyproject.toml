[project]
name = "friday-agent-core"
version = "0.1.2"
description = "A lightweight node-flow runtime for building tool-using agents. Import name: agent_core."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lancetwang" }]
keywords = ["agent", "llm", "runtime", "flow", "tools", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.88.0",
]

[project.urls]
Homepage = "https://github.com/Lancetwang/agent-core-runtime"
Repository = "https://github.com/Lancetwang/agent-core-runtime"
Issues = "https://github.com/Lancetwang/agent-core-runtime/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
