[project]
name = "friday-agent-core"
version = "0.2.0"
description = "A lightweight node-flow runtime for building tool-using agents. Import name: agent_core."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lancetwang" }]
keywords = ["agent", "llm", "runtime", "flow", "tools", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.88.0",
]

[project.urls]
Homepage = "https://github.com/Lancetwang/agent-core-runtime"
Repository = "https://github.com/Lancetwang/agent-core-runtime"
Issues = "https://github.com/Lancetwang/agent-core-runtime/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[dependency-groups]
dev = [
    "coverage>=7.10.0",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
reportUnusedExpression = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["T201"]

[tool.coverage.run]
source = ["agent_core"]

[tool.coverage.report]
fail_under = 85
show_missing = true
