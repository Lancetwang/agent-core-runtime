name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Run tests
        run: uv run python -m unittest discover -s tests
      - name: Compile all sources
        run: uv run python -m compileall src tests examples
      - name: Build distributions
        run: uv build
